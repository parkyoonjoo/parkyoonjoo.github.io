# GitHub Pages 자동 배포
# main 브랜치에 올리면(push) 사이트를 빌드해서 GitHub Pages에 게시합니다.
# 처음 한 번만: GitHub 저장소 > Settings > Pages > Build and deployment > Source 를 "GitHub Actions"로 바꿔 주세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          # 저장소 이름이 <아이디>.github.io 이면 최상위 주소, 아니면 /<저장소이름>/ 아래에 게시
          if [[ "$REPO" == *.github.io ]]; then export SITE_BASE="/"; else export SITE_BASE="/$REPO"; fi
          export SITE_URL="https://${{ github.repository_owner }}.github.io"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
